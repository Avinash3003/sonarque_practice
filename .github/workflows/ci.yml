name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # SonarQube requires full history

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m ipykernel install --user

    - name: Setup Databricks CLI
      uses: databricks/setup-cli@main

    - name: Run unit and integration tests with coverage
      run: |
        # Run pytest, targeting tests directory.
        # We use testbook to test notebook logic.
        python -m pytest tests/ --junitxml=test-reports/junit.xml

    - name: Validate Databricks Asset Bundle
      run: |
        databricks bundle validate
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    # SonarQube scan configuration (commented out until credentials are set)
