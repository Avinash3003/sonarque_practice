# SonarQube configuration for the Databricks ML migration project
sonar.projectKey=unum-mini-project
sonar.projectName=UNUM ML Migration Project

# Source directories
sonar.sources=notebooks,data,resources
# Exclude test files from source analysis
sonar.exclusions=tests/**,**/*.json,**/__pycache__/**

# Test directories
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Python specific config
sonar.language=py
sonar.python.coverage.reportPaths=coverage.xml

