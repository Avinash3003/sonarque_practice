# SonarQube / SonarCloud configuration for the Databricks ML migration project
sonar.organization=avinash3003
sonar.projectKey=Avinash3003_sonarque_practice
sonar.projectName=UNUM ML Migration Project

# Source directories
sonar.sources=notebooks,tests
# Exclude generated and cache files
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/*.ipynb_checkpoints/**,data/**

# Test directories
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Python specific config
sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-reports/junit.xml

